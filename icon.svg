<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="72%">
      <stop offset="0" stop-color="#1b1460"/>
      <stop offset=".45" stop-color="#070c2c"/>
      <stop offset="1" stop-color="#010208"/>
    </radialGradient>
    <radialGradient id="gate" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8f6ff" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#5fc8ff" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#2a4bff" stop-opacity=".55"/>
      <stop offset=".8" stop-color="#3a14a8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#12052e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe3ff"/>
      <stop offset=".5" stop-color="#3d7bff"/>
      <stop offset="1" stop-color="#a24dff"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#3f8dff"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2f6e"/>
      <stop offset=".5" stop-color="#0a1438"/>
      <stop offset="1" stop-color="#050a20"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- portal / gate -->
  <circle cx="256" cy="256" r="190" fill="url(#gate)" filter="url(#soft)" opacity=".9"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="10" filter="url(#glow)"/>
  <g fill="none" stroke-linecap="round" opacity=".8">
    <circle cx="256" cy="256" r="145" stroke="#7fd6ff" stroke-width="4" stroke-dasharray="120 60 40 90" transform="rotate(20 256 256)"/>
    <circle cx="256" cy="256" r="122" stroke="#9b6bff" stroke-width="3" stroke-dasharray="70 50 140 40" transform="rotate(-40 256 256)"/>
    <circle cx="256" cy="256" r="98" stroke="#bfe9ff" stroke-width="2.5" stroke-dasharray="50 40 90 30" transform="rotate(80 256 256)"/>
  </g>

  <!-- haltere -->
  <g transform="rotate(-32 256 256)" filter="url(#glow)">
    <rect x="96" y="246" width="320" height="20" rx="6" fill="url(#metal)"/>
    <!-- lado esquerdo -->
    <rect x="70" y="214" width="26" height="84" rx="7" fill="url(#plate)" stroke="#8fe3ff" stroke-width="5"/>
    <rect x="104" y="186" width="36" height="140" rx="8" fill="url(#plate)" stroke="#bfefff" stroke-width="6"/>
    <rect x="140" y="236" width="14" height="40" rx="3" fill="url(#metal)"/>
    <!-- lado direito -->
    <rect x="416" y="214" width="26" height="84" rx="7" fill="url(#plate)" stroke="#8fe3ff" stroke-width="5"/>
    <rect x="372" y="186" width="36" height="140" rx="8" fill="url(#plate)" stroke="#bfefff" stroke-width="6"/>
    <rect x="358" y="236" width="14" height="40" rx="3" fill="url(#metal)"/>
    <!-- brilho nos discos -->
    <rect x="112" y="196" width="6" height="120" rx="3" fill="#ffffff" opacity=".55"/>
    <rect x="380" y="196" width="6" height="120" rx="3" fill="#ffffff" opacity=".55"/>
  </g>

  <!-- partículas de mana -->
  <g fill="#cfefff" filter="url(#tiny)">
    <circle cx="120" cy="120" r="5"/><circle cx="402" cy="96" r="4"/><circle cx="420" cy="380" r="6"/>
    <circle cx="96" cy="400" r="4"/><circle cx="256" cy="60" r="3.5"/><circle cx="460" cy="250" r="3.5"/>
    <circle cx="54" cy="270" r="3"/><circle cx="330" cy="460" r="4"/>
  </g>
  <g fill="#ffffff">
    <circle cx="120" cy="120" r="2"/><circle cx="402" cy="96" r="1.6"/><circle cx="420" cy="380" r="2.2"/>
    <circle cx="96" cy="400" r="1.6"/><circle cx="256" cy="60" r="1.4"/><circle cx="330" cy="460" r="1.6"/>
  </g>
</svg>
