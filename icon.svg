<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1a1a6e"/>
      <stop offset=".4" stop-color="#0a0b33"/>
      <stop offset="1" stop-color="#010108"/>
    </radialGradient>
    <radialGradient id="gate" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6f5ff"/>
      <stop offset=".2" stop-color="#6cc6ff"/>
      <stop offset=".55" stop-color="#2546ff" stop-opacity=".7"/>
      <stop offset=".85" stop-color="#3b10a0" stop-opacity=".3"/>
      <stop offset="1" stop-color="#12052e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe8ff"/><stop offset=".5" stop-color="#3d7bff"/><stop offset="1" stop-color="#b04dff"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7b2cff" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#4b18c9" stop-opacity=".6"/>
      <stop offset="1" stop-color="#2a0a80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#bfe9ff"/><stop offset="1" stop-color="#4a8dff"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1236"/><stop offset=".5" stop-color="#1b2a6a"/><stop offset="1" stop-color="#070b24"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="d"/>
      <feFlood flood-color="#7fd0ff"/><feComposite in2="d" operator="in" result="edge"/>
      <feGaussianBlur in="edge" stdDeviation="5" result="eb"/>
      <feMerge><feMergeNode in="eb"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="tiny" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- portal atrás da figura -->
  <circle cx="256" cy="226" r="175" fill="url(#gate)" filter="url(#soft)" opacity=".85"/>
  <circle cx="256" cy="226" r="160" fill="none" stroke="url(#ring)" stroke-width="7" filter="url(#glow)"/>
  <g fill="none" stroke-linecap="round" opacity=".7">
    <circle cx="256" cy="226" r="138" stroke="#8fdcff" stroke-width="3" stroke-dasharray="110 50 30 80" transform="rotate(15 256 226)"/>
    <circle cx="256" cy="226" r="116" stroke="#a070ff" stroke-width="2.5" stroke-dasharray="60 40 120 30" transform="rotate(-50 256 226)"/>
  </g>

  <!-- chamas de sombra roxas -->
  <g filter="url(#blur6)" fill="url(#flame)">
    <path d="M70 512 C60 420 120 400 110 330 C150 380 140 420 170 440 C160 380 190 330 180 280 C230 340 220 400 256 430 C290 400 280 340 332 280 C322 330 352 380 342 440 C372 420 362 380 402 330 C392 400 452 420 442 512 Z"/>
  </g>
  <g fill="#9b5cff" opacity=".55" filter="url(#tiny)">
    <path d="M120 512 C118 460 150 440 146 400 C172 440 160 470 182 512 Z"/>
    <path d="M392 512 C394 460 362 440 366 400 C340 440 352 470 330 512 Z"/>
  </g>

  <!-- barra acima da cabeça -->
  <g filter="url(#glow)">
    <rect x="62" y="132" width="388" height="14" rx="5" fill="url(#bar)"/>
    <rect x="44" y="104" width="22" height="70" rx="6" fill="url(#plate)" stroke="#8fe3ff" stroke-width="4"/>
    <rect x="70" y="88" width="30" height="102" rx="7" fill="url(#plate)" stroke="#c4f0ff" stroke-width="5"/>
    <rect x="446" y="104" width="22" height="70" rx="6" fill="url(#plate)" stroke="#8fe3ff" stroke-width="4"/>
    <rect x="412" y="88" width="30" height="102" rx="7" fill="url(#plate)" stroke="#c4f0ff" stroke-width="5"/>
    <rect x="76" y="96" width="5" height="86" rx="2.5" fill="#fff" opacity=".5"/>
    <rect x="418" y="96" width="5" height="86" rx="2.5" fill="#fff" opacity=".5"/>
  </g>

  <!-- silhueta de sombra a segurar a barra -->
  <g filter="url(#rim)">
    <path fill="#03040d" d="M148 124 L182 124 L188 150 C192 176 194 200 202 222 C208 238 216 248 226 254 L286 254
      C296 248 304 238 310 222 C318 200 320 176 324 150 L330 124 L364 124 L358 152 C352 184 348 214 344 236
      C342 252 340 262 336 270 C348 282 344 298 332 306 C322 332 308 360 302 386
      C322 420 352 462 374 512 L138 512 C160 462 190 420 210 386 C204 360 190 332 180 306
      C168 298 164 282 176 270 C172 262 170 252 168 236 C164 214 160 184 154 152 Z"/>
    <path fill="#03040d" d="M256 164 C278 178 292 200 292 226 C290 248 276 260 256 264 C236 260 222 248 220 226 C220 200 234 178 256 164 Z"/>
  </g>
  <!-- abertura do capuz -->
  <path fill="#000" d="M256 196 C270 202 278 214 278 228 C276 242 268 250 256 252 C244 250 236 242 234 228 C234 214 242 202 256 196 Z"/>
  <path fill="none" stroke="#7fd0ff" stroke-width="2" opacity=".55" d="M234 230 C234 212 244 200 256 194 C268 200 278 212 278 230"/>
  <!-- fendas do casaco -->
  <path fill="#0d1440" opacity=".9" d="M256 400 L248 512 L264 512 Z M214 430 L196 512 L208 512 Z M298 430 L316 512 L304 512 Z"/>

  <!-- olhos a brilhar -->
  <g filter="url(#glow)">
    <path d="M240 222 L254 226 L242 230 Z" fill="#e2f7ff"/>
    <path d="M272 222 L258 226 L270 230 Z" fill="#e2f7ff"/>
  </g>
  <g fill="#5fd3ff" opacity=".9" filter="url(#tiny)">
    <circle cx="247" cy="226" r="7"/><circle cx="265" cy="226" r="7"/>
  </g>

  <!-- partículas de mana -->
  <g fill="#cfefff" filter="url(#tiny)">
    <circle cx="110" cy="250" r="4"/><circle cx="410" cy="260" r="4"/><circle cx="160" cy="60" r="3.5"/>
    <circle cx="360" cy="54" r="3"/><circle cx="460" cy="330" r="3.5"/><circle cx="50" cy="320" r="3"/>
    <circle cx="256" cy="34" r="3"/>
  </g>
  <g fill="#ffffff">
    <circle cx="110" cy="250" r="1.6"/><circle cx="410" cy="260" r="1.6"/><circle cx="160" cy="60" r="1.4"/><circle cx="256" cy="34" r="1.2"/>
  </g>
</svg>
